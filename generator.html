<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digi Closet - Outfit Builder</title>
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/format.css">
    <link rel="stylesheet" href="styles/effects.css">
</head>
<body>
    <header>
        <h1>Digi Closet</h1>
        <p class="subtitle">Your Digital Style Space</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="wardrobe.html">Wardrobe</a>
        <a href="generator.html" class="active">Outfit Builder</a>
        <a href="about.html">About</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Interactive Outfit Builder</h2>
            <div class="builder-workspace">
                <div class="upload-panel">
                    <p>Insert pictures of existing clothing items inside your closet.</p>
                    <label class="custom-file-upload">
                        <input type="file" id="clothing-upload" accept="image/*" onchange="handleImageUpload(event)" style="display:none;">
                        📷 Choose or Snap Photo
                    </label>
                </div>
                <div>
                    <h3>Your Active Canvas</h3>
                    <div class="canvas-area" id="closet-canvas"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="card inspiration-section">
        <div class="look-card">
            <h3>Outfit Inspiration</h3>
            <p>Get inspired by these trendy outfit combinations to spark your creativity!</p>
                    <div class="image-wrapper">
                        <img src="images/beige.jpg" alt="A descriptive name of the outfit or item">
                    </div>
                    <div class="image-wrapper">
                        <img src="images/red.jpg" alt="A descriptive name of the outfit or item">
                    </div>
                    <div class="image-wrapper">
                        <img src="images/pink.jpg" alt="A descriptive name of the outfit or item">
                    </div>
    </div>

    <script src="javascript/app.js"></script>
</body>
</html>
